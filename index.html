/* home */
const W=C.weather;
$("#wg").innerHTML=`<div class="w g"><b>${E(W.place)}</b><div class="t">${E(W.temp)}</div><div>${E(W.desc)}</div><div style="opacity:.8">최고 ${E(W.high)} 최저 ${E(W.low)}</div></div>
<div class="w g"><b>일정</b>${C.events.map(e=>`<div class="ev"><i>${E(e.time)}</i>${E(e.title)}</div>`).join("")}</div>`;
const A=[["사진","🌸","linear-gradient(#fff,#ddd)"],["메모","📝","linear-gradient(#ffd60a,#f5b800)"],["지도","🗺","linear-gradient(#5ac8fa,#34c759)"],["설정","⚙️","linear-gradient(#8e8e93,#636366)"],["YouTube","▶","#ff0000"],["Spotify","♫","#1db954","spp"],["Instagram","◎","linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)","ig"],["X","𝕏","#000","xx"]];
const D=[["전화","✆","#34c759","ph1"],["KakaoTalk","💬","#fee500","kk"],["메시지","✉","#34c759"],["카메라","📷","#8e8e93"]];
const ico=a=>`<div><div class="ic" style="background:${a[2]};${a[0]=="KakaoTalk"?"color:#3c1e1e;":""}" ${a[3]?`data-o="${a[3]}"`:""}>${a[1]}</div>${a[0]}</div>`;
$("#grid").innerHTML=A.map(ico).join("");
$("#dock").innerHTML=D.map(a=>ico(a).replace(/<\/div>[^<]*<\/div>$/,"</div></div>").replace(/(<\/div>)([^<]+)(<\/div>)$/,"$1$3")).join("");
const home=()=>{$$(".app").forEach(a=>a.classList.remove("on"));$("#kc").style.display=$("#kp").style.display="none";$("#fp").classList.remove("on");igStop()};
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-o]");if(o){const id=o.dataset.o;$("#"+id).classList.add("on");if(id=="ig")igRing();if(id=="spp")spRender();return}
  if(e.target.closest(".bar")&&!e.target.closest("#kc .ci"))home();
  if(e.target.closest("[data-hang]"))home()});
/* phone */
const T={"发":"발신","收":"수신","未接":"부재중"};
$("#calls").innerHTML=C.calls.map(g=>`<div class="grp">${E(g.group)}</div>`+g.items.map(i=>`<div class="cl ${i.type=="未接"?"miss":""}"><div class="n">${E(C.contactName)}${i.count?` (${E(i.count)})`:""}<small>${T[i.type]||E(i.type)}</small></div><span class="tm">${E(i.time)}</span><span class="i">ⓘ</span></div>`).join("")).join("");
/* kakao */
const av=(n,u,cl="av",x="")=>`<div class="${cl}" style="${bg(u)};${x}">${u?"":ini(n)}</div>`;
$("#me-pf").innerHTML=av(C.userName)+`<b style="font-size:17px">${E(C.userName)}</b>`;
$("#fr").innerHTML=av(C.contactName,C.contactAvatar,"av","background-color:#7d8a99")+`<span>${E(C.contactName)}</span>`;
const bub=(c,u,first)=>c.from=="对方"?`<div class="r l">${first?av(C.contactName,C.contactAvatar,"av s"):'<div style="width:40px"></div>'}<div>${first?`<div class="nm">${E(C.contactName)}</div>`:""}<div class="lr"><div class="bb w">${E(c.text)}</div><div class="m">${E(c.time)}</div></div></div></div>`:`<div class="r"><div class="m">${u?"<b>1</b>":""}${E(c.time)}</div><div class="bb">${E(c.text)}</div></div>`;
function chatInit(){const L=C.chat,lc=L.map(c=>c.from).lastIndexOf("对方");$("#cm").innerHTML=`<div class="dt">${E(C.chatDate)}</div>`+L.map((c,i)=>bub(c,c.from!="对方"&&i>lc,c.from=="对方"&&(i==0||L[i-1].from!="对方"))).join("");$("#cm").scrollTop=1e5}
$("#me-pf").onclick=()=>{$("#kpa").style.cssText=bg("");$("#kpa").textContent=ini(C.userName);$("#kpn").textContent=C.userName;$("#kp").style.display="flex"};
$("#kpx").onclick=()=>$("#kp").style.display="none";
$("#fr").onclick=()=>{$("#kcn").textContent=C.contactName;chatInit();$("#kc").style.display="flex"};
$("#kcb").onclick=()=>$("#kc").style.display="none";
function send(){const v=$("#ci").value.trim();if(!v)return;const d=new Date(),h=d.getHours();$("#cm").insertAdjacentHTML("beforeend",bub({from:"我",time:`${h<12?"오전":"오후"} ${h%12||12}:${String(d.getMinutes()).padStart(2,"0")}`,text:v},true));$("#ci").value="";$("#cm").scrollTop=1e5}
$("#cs").onclick=send;$("#ci").onkeydown=e=>e.key=="Enter"&&send();
/* X */
const H=C.twitterHandle,N=C.userName;
$("#xt").innerHTML=`${E(N)} 🔒`;
$("#xp").innerHTML=`${av(N,"")}<div class="xn">${E(N)} 🔒</div><div class="xh">@${E(H)}</div><div class="xs"><b>${C.tweets.length}</b> 게시물 &nbsp; <b>12</b> 팔로우 중 &nbsp; <b>9</b> 팔로워</div>`;
$("#tl").innerHTML=C.tweets.map((t,i)=>`<div class="tw">${av(N,"")}<div style="flex:1;min-width:0"><div><b>${E(N)}</b> 🔒 <span class="xh">@${E(H)} · 10월 ${Math.max(1,26-i)}일</span></div><p>${E(t)}</p><div class="e"><span>💬 ${(i*3)%5}</span><span>🔁 ${(i*2)%4}</span><span>♡ ${(i*7)%11+1}</span><span>📊 ${(i*37)%90+20}</span></div></div></div>`).join("");
/* instagram */
const I=C.instagram;let tms=[],tint=null,sec=0;
const avh=(n,u)=>(u?"":ini(n));
function igRing(){igStop();const a=$("#ia1");a.style.cssText=bg(I.avatar);a.textContent=avh(I.callerName,I.avatar);$("#cn1").textContent=I.callerName;$("#cn2").textContent=I.callerName;$("#igIn").style.display="flex";$("#igCall").style.display="none"}
function igStop(){tms.forEach(clearTimeout);tms=[];clearInterval(tint);["#mv","#sv"].forEach(s=>{try{$(s).pause()}catch(e){}});$("#igIn").style.display=$("#igCall").style.display="none";$("#ov").innerHTML=""}
function say(from,text){const d=document.createElement("div"),me=from=="我";d.innerHTML=`<b>${E(me?C.userName:I.callerName)}</b>${E(text)}`;const o=$("#ov");o.appendChild(d);while(o.children.length>4)o.firstChild.remove();setTimeout(()=>d.classList.add("f"),5500);setTimeout(()=>d.remove(),6600)}
function vid(sel,src){const v=$(sel);v.style.display="";v.onerror=()=>v.style.display="none";v.muted=true;v.src=src||"";if(src)v.play().catch(()=>{})}
$("#acc").onclick=()=>{$("#igIn").style.display="none";$("#igCall").style.display="flex";sec=0;$("#tm").textContent="00:00";
  vid("#mv",I.video);vid("#sv",I.selfVideo);
  tint=setInterval(()=>{sec++;$("#tm").textContent=String(sec/60|0).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
  let t=0;I.messages.forEach(m=>{t+=(m.delay||3)*1000;tms.push(setTimeout(()=>say(m.from,m.text),t))})};
$("#igCall").addEventListener("click",()=>{const v=$("#mv");if(v.muted){v.muted=false;v.play().catch(()=>{})}});
$("#mi").onkeydown=e=>{if(e.key=="Enter"&&e.target.value.trim()){say("我",e.target.value.trim());e.target.value=""}};
$("#mi").onclick=e=>e.stopPropagation();
$("#b1").onclick=e=>{e.stopPropagation();$("#sv").style.transform=$("#sv").style.transform?"":"scaleX(-1)"};
$("#b2").onclick=e=>{e.stopPropagation();e.currentTarget.classList.toggle("off")};
$("#b3").onclick=e=>{e.stopPropagation();e.currentTarget.classList.toggle("off");$("#me").style.display=e.currentTarget.classList.contains("off")?"none":""};
document.querySelectorAll("#igCall .cb").forEach(b=>b.addEventListener("click",e=>e.stopPropagation()));
(()=>{const m=$("#me");let s=null;m.onpointerdown=e=>{e.stopPropagation();m.setPointerCapture(e.pointerId);s={x:e.clientX-m.offsetLeft,y:e.clientY-m.offsetTop}};
m.onpointermove=e=>{if(!s)return;const p=$("#igCall");m.style.left=Math.max(0,Math.min(p.clientWidth-m.offsetWidth,e.clientX-s.x))+"px";m.style.top=Math.max(0,Math.min(p.clientHeight-m.offsetHeight,e.clientY-s.y))+"px";m.style.right="auto"};
m.onpointerup=()=>s=null;m.onclick=e=>e.stopPropagation()})();
/* spotify */
const S=C.spotify,L=S.songs;let cur=-1,playing=false,pos=0,shuf=false,rep=false,au=null,timer=null;
const fmt=s=>(s/60|0)+":"+String(Math.floor(s%60)).padStart(2,"0");
const dur=()=>(au&&isFinite(au.duration)?au.duration:L[cur]?.duration||180);
const cov=(el)=>{el.style.backgroundImage=S.cover?`url('${S.cover}')`:"";el.innerHTML=S.cover?"":"♫"};
function spRender(){
  $("#spc").innerHTML=`<div class="cv" id="hc"></div><div class="pn"><h1>${E(S.playlistName)}</h1><p>${E(C.userName)} · ${L.length}곡</p></div>
  <div class="ar"><span>⤓</span><span>⇪</span><span>⋯</span><span style="flex:1"></span><span>⤮</span><button class="pb" id="hp">${playing?"❚❚":"▶"}</button></div>`+
  L.map((s,i)=>`<div class="sg ${i==cur?"pl":""} ${playing?"":"pa"}" data-i="${i}"><div><b><span class="eq"><i></i><i></i><i></i></span>${E(s.title)}</b><small>${E(s.artist)}</small></div><span>⋮</span></div>`).join("");
  cov($("#hc"));$("#hp").onclick=()=>cur<0?play(0):toggle();
  $$(".sg").forEach(r=>r.onclick=()=>play(+r.dataset.i))}
function play(i){cur=i;pos=0;if(au){au.pause();au=null}const s=L[i];if(s.audio){au=new Audio(s.audio);au.onerror=()=>au=null;au.play().catch(()=>{})}
  playing=true;$("#mini").style.display="flex";info();spRender();clearInterval(timer);timer=setInterval(step,250)}
function info(){const s=L[cur];$("#mt").textContent=$("#ft").textContent=s.title;$("#ma").textContent=$("#fa").textContent=s.artist;cov($("#fc"));const c=$("#mc");c.style.backgroundImage=S.cover?`url('${S.cover}')`:"";c.textContent=S.cover?"":"♫";c.style.textAlign="center";c.style.lineHeight="38px";btn()}
function btn(){$("#mpp").textContent=$("#fpp").textContent=playing?"❚❚":"▶";const h=$("#hp");if(h)h.textContent=playing?"❚❚":"▶";$$(".sg").forEach(r=>r.classList.toggle("pa",!playing))}
function toggle(){playing=!playing;if(au)playing?au.play():au.pause();btn()}
function step(){if(!playing)return;if(au)pos=au.currentTime;else pos+=.25;const d=dur();if(pos>=d)return next(true);
  $("#mpr").style.width=pos/d*100+"%";if(!$("#sk").matches(":active"))$("#sk").value=pos/d*1000;$("#t1").textContent=fmt(pos);$("#t2").textContent=fmt(d)}
function next(auto){if(auto&&rep)return play(cur);play(shuf?Math.floor(Math.random()*L.length):(cur+1)%L.length)}
$("#mpp").onclick=e=>{e.stopPropagation();toggle()};$("#fpp").onclick=toggle;
$("#nxt").onclick=()=>next();$("#prv").onclick=()=>pos>3?play(cur):play((cur-1+L.length)%L.length);
$("#shf").onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle("on",shuf)};$("#rep").onclick=e=>{rep=!rep;e.currentTarget.classList.toggle("on",rep)};
$("#sk").oninput=e=>{const d=dur();pos=e.target.value/1000*d;if(au)au.currentTime=pos;$("#t1").textContent=fmt(pos)};
$("#mini").onclick=()=>$("#fp").classList.add("on");$("#fdn").onclick=()=>$("#fp").classList.remove("on");
</script></body></html>
